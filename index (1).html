<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>Care Academy — Quiz Hub</title>
<style>
:root{--bg:#080d1b;--panel:#111a2d;--ink:#f4f7ff;--muted:#aab7d0;--cyan:#5ce1e6;--violet:#9b83ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 8%,#202b56 0,transparent 34%),radial-gradient(circle at 90% 80%,#163b45 0,transparent 30%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:32px 32px;z-index:-1}
header{width:min(1120px,94%);margin:auto;padding:44px 0 26px;text-align:center}
.eyebrow{display:inline-block;padding:8px 13px;border:1px solid #5ce1e655;background:#5ce1e611;border-radius:999px;color:var(--cyan);font-weight:850;letter-spacing:.14em;font-size:.75rem;text-transform:uppercase}
h1{font-size:clamp(2.25rem,6vw,4.7rem);line-height:1;margin:20px 0 14px;letter-spacing:-.055em;background:linear-gradient(90deg,#fff,var(--cyan),#c5b7ff);background-clip:text;color:transparent}
header p{max-width:660px;margin:0 auto;color:var(--muted);line-height:1.7;font-size:1.05rem}
main{width:min(1120px,94%);margin:0 auto 56px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
.count{color:var(--muted);font-size:.9rem;font-weight:750}
.search{width:min(330px,100%);padding:12px 15px;border-radius:13px;border:1px solid var(--line);background:#ffffff0a;color:var(--ink);font:inherit;outline:none}
.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5ce1e622}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.quiz-card{min-height:220px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:21px;border:1px solid var(--line);border-radius:22px;color:var(--ink);background:linear-gradient(145deg,#15213aee,#0d1527f2);box-shadow:0 15px 45px #0003;cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s;position:relative;overflow:hidden}
.quiz-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--cyan),var(--violet));opacity:.9}
.quiz-card:hover{transform:translateY(-5px);border-color:#5ce1e688;box-shadow:0 20px 50px #0005,0 0 25px #5ce1e610}
.quiz-card:focus-visible,.close-btn:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
.card-icon{width:48px;height:48px;display:grid;place-items:center;font-size:1.7rem;border-radius:15px;background:linear-gradient(135deg,#5ce1e622,#9b83ff22);border:1px solid #ffffff12;margin-bottom:15px}
.card-title{font-weight:900;font-size:1.08rem;line-height:1.35}
.card-desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin-top:8px}
.card-open{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--cyan);font-size:.88rem;font-weight:850;margin-top:auto;padding-top:18px;width:100%}
.empty{display:none;text-align:center;color:var(--muted);padding:35px}
#quizView{display:none;position:fixed;inset:0;z-index:10;background:var(--bg)}
.quiz-head{height:60px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0d1527;border-bottom:1px solid var(--line);position:relative;z-index:2}
.close-btn{border:1px solid #ffffff22;border-radius:12px;padding:10px 15px;background:#ffffff0b;color:var(--ink);font:inherit;font-weight:850;cursor:pointer;white-space:nowrap}
.quiz-name{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quiz-frame{display:block;border:0;width:100%;height:calc(100% - 60px);background:white}
footer{text-align:center;color:#75839f;font-size:.82rem;padding:0 15px 28px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quiz-card{min-height:210px;padding:17px}header{padding-top:32px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.quiz-card{min-height:170px}.card-icon{margin-bottom:10px}.toolbar{align-items:stretch}.search{width:100%}}
</style>
</head>
<body>
<header>
  <span class="eyebrow">Your revision library</span>
  <h1>Care Academy</h1>
  <p>Choose a quiz below to begin. Answer each question, submit your choice, move to the next question, and close the quiz whenever you want to return here.</p>
</header>
<main>
  <div class="toolbar">
    <span class="count" id="quizCount">15 quizzes available</span>
    <input class="search" id="search" type="search" placeholder="Search quizzes…" aria-label="Search quizzes">
  </div>
  <section class="grid" id="quizGrid" aria-label="Available quizzes">
      <button class="quiz-card" type="button" data-file="healthcare_ethics_quiz.html" data-title="Healthcare Ethics &amp; Law">
        <span class="card-icon" aria-hidden="true">⚖️</span>
        <span class="card-title">Healthcare Ethics &amp; Law</span>
        <span class="card-desc">Ethics, rights, confidentiality and healthcare law</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="health_social_care_quiz.html" data-title="Health &amp; Social Care">
        <span class="card-icon" aria-hidden="true">🤝</span>
        <span class="card-title">Health &amp; Social Care</span>
        <span class="card-desc">Core principles and practice in care</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="healthcare_social_care_50_question_quiz.html" data-title="Healthcare &amp; Social Care — 50 Questions">
        <span class="card-icon" aria-hidden="true">🩺</span>
        <span class="card-title">Healthcare &amp; Social Care — 50 Questions</span>
        <span class="card-desc">A 50-question healthcare and social care challenge</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="community_health_quiz.html" data-title="Community Health">
        <span class="card-icon" aria-hidden="true">🌍</span>
        <span class="card-title">Community Health</span>
        <span class="card-desc">Community health and disease management</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="dementia_care_interactive_quiz.html" data-title="Dementia Care">
        <span class="card-icon" aria-hidden="true">🧠</span>
        <span class="card-title">Dementia Care</span>
        <span class="card-desc">Person-centred dementia care</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="vital_signs_interactive_quiz.html" data-title="Vital Signs">
        <span class="card-icon" aria-hidden="true">💓</span>
        <span class="card-title">Vital Signs</span>
        <span class="card-desc">Vital signs knowledge and practice</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="first_aid_day_two_interactive_quiz.html" data-title="First Aid — Day Two">
        <span class="card-icon" aria-hidden="true">🚑</span>
        <span class="card-title">First Aid — Day Two</span>
        <span class="card-desc">First aid and emergency management</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="first_aid_medical_terms_quiz.html" data-title="First Aid &amp; Medical Terms">
        <span class="card-icon" aria-hidden="true">🩹</span>
        <span class="card-title">First Aid &amp; Medical Terms</span>
        <span class="card-desc">First aid terminology and medical terms</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="week3_hca_quiz.html" data-title="Week 3 HCA">
        <span class="card-icon" aria-hidden="true">📘</span>
        <span class="card-title">Week 3 HCA</span>
        <span class="card-desc">Healthcare assistant revision quiz</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="bandaging_master_quiz_50.html" data-title="Bandaging Master — 50 Questions">
        <span class="card-icon" aria-hidden="true">🩺</span>
        <span class="card-title">Bandaging Master — 50 Questions</span>
        <span class="card-desc">Bandaging techniques and knowledge</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="assisted_daily_living_home_care_quiz.html" data-title="Assisted Daily Living &amp; Home Care">
        <span class="card-icon" aria-hidden="true">🏡</span>
        <span class="card-title">Assisted Daily Living &amp; Home Care</span>
        <span class="card-desc">Daily living support and home care</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="safeguarding_child_care_quiz_fixed.html" data-title="Safeguarding &amp; Child Care">
        <span class="card-icon" aria-hidden="true">🛡️</span>
        <span class="card-title">Safeguarding &amp; Child Care</span>
        <span class="card-desc">Safeguarding principles and child care</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="safeguarding_childcare_50_question_quiz.html" data-title="Safeguarding &amp; Childcare — 50 Questions">
        <span class="card-icon" aria-hidden="true">👶</span>
        <span class="card-title">Safeguarding &amp; Childcare — 50 Questions</span>
        <span class="card-desc">A 50-question safeguarding challenge</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="mental_health_quiz_challenge.html" data-title="Mental Health">
        <span class="card-icon" aria-hidden="true">💜</span>
        <span class="card-title">Mental Health</span>
        <span class="card-desc">Mental health knowledge challenge</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
      <button class="quiz-card" type="button" data-file="psychological_theories_models_of_care_quiz(1)(1).html" data-title="Psychological Theories &amp; Models of Care">
        <span class="card-icon" aria-hidden="true">🧩</span>
        <span class="card-title">Psychological Theories &amp; Models of Care</span>
        <span class="card-desc">Theories and models used in care</span>
        <span class="card-open">Open quiz <span aria-hidden="true">↗</span></span>
      </button>
  </section>
  <div class="empty" id="empty">No quizzes match that search.</div>
</main>
<footer>Care Academy · Quiz Hub</footer>
<section id="quizView" aria-label="Selected quiz" aria-hidden="true">
  <div class="quiz-head">
    <button class="close-btn" id="closeQuiz" type="button">← Home / Close</button>
    <div class="quiz-name" id="quizName">Quiz</div>
  </div>
  <iframe class="quiz-frame" id="quizFrame" title="Interactive quiz" allow="fullscreen"></iframe>
</section>
<script>
const grid = document.getElementById('quizGrid');
const cards = [...document.querySelectorAll('.quiz-card')];
const view = document.getElementById('quizView');
const frame = document.getElementById('quizFrame');
const quizName = document.getElementById('quizName');
const search = document.getElementById('search');
const count = document.getElementById('quizCount');
const empty = document.getElementById('empty');

function openQuiz(card) {
  const file = card.dataset.file;
  quizName.textContent = card.dataset.title;
  frame.src = file;
  view.style.display = 'block';
  view.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.title = card.dataset.title + ' — Care Academy';
  document.getElementById('closeQuiz').focus();
}
function closeQuiz() {
  view.style.display = 'none';
  view.setAttribute('aria-hidden', 'true');
  frame.src = 'about:blank';
  document.body.style.overflow = '';
  document.title = 'Care Academy — Quiz Hub';
}
cards.forEach(card => card.addEventListener('click', () => openQuiz(card)));
document.getElementById('closeQuiz').addEventListener('click', closeQuiz);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && view.style.display === 'block') closeQuiz(); });
search.addEventListener('input', () => {
  const term = search.value.trim().toLowerCase();
  let visible = 0;
  cards.forEach(card => {
    const matches = card.dataset.title.toLowerCase().includes(term) || card.textContent.toLowerCase().includes(term);
    card.style.display = matches ? 'flex' : 'none';
    if (matches) visible++;
  });
  count.textContent = `${visible} quiz${visible === 1 ? '' : 'zes'} available`;
  empty.style.display = visible ? 'none' : 'block';
});
</script>
</body>
</html>
